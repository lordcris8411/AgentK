<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const cached = JSON.parse(localStorage.getItem("agent-k-settings") || "{}");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = cached.theme === "soft-light"
          ? "soft-light"
          : cached.theme === "dark" || (cached.theme === "system" && systemDark)
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
    </script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --surface-app: #f7f6f4;
        --surface-raised: #ffffff;
        --surface-active: #e6e1dc;
        --border-color: #e5e2dd;
        --border-strong: #dcd7d1;
        --text-primary: #272625;
        --text-muted: #98928a;
        --accent: #302d2a;
        --icon-primary: #272625;
        --icon-secondary: #ffffff;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --icon-primary: #ece9e4;
        --icon-secondary: #252422;
        color-scheme: dark;
      }
      html, body { background: transparent; }
      body { align-items: center; color: var(--text-primary); display: flex; font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; height: 100vh; justify-content: center; margin: 0; }
      main { align-items: center; background: var(--surface-raised); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 12px 32px rgb(0 0 0 / 18%); display: flex; gap: 18px; min-height: 122px; padding: 24px 26px; width: 348px; }
      .mark { display: block; flex: 0 0 auto; height: 68px; position: relative; width: 68px; }
      .mark span { inset: 0; mask-position: center; mask-repeat: no-repeat; mask-size: contain; position: absolute; -webkit-mask-position: center; -webkit-mask-repeat: no-repeat; -webkit-mask-size: contain; }
      .mark .primary { background: var(--icon-primary); mask-image: url("../assets/icons/icon-primary-mask.png"); -webkit-mask-image: url("../assets/icons/icon-primary-mask.png"); }
      .mark .secondary { background: var(--icon-secondary); mask-image: url("../assets/icons/icon-secondary-mask.png"); -webkit-mask-image: url("../assets/icons/icon-secondary-mask.png"); }
      main div { flex: 1; min-width: 0; }
      strong { display: block; font-size: 17px; letter-spacing: -.02em; line-height: 1.3; }
      p { color: var(--text-muted); font-size: 12px; line-height: 1.55; margin: 7px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .track { background: var(--surface-active); border-radius: 999px; height: 3px; margin-top: 10px; overflow: hidden; width: 100%; }
      .progress { background: var(--text-secondary, var(--accent)); border-radius: inherit; display: block; height: 100%; transition: width 180ms ease; width: 0; }
      i { animation: spin .8s linear infinite; border: 2px solid var(--border-strong); border-radius: 50%; border-right-color: var(--text-primary); flex: 0 0 auto; height: 17px; margin-left: 4px; width: 17px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body><main><span aria-hidden="true" class="mark"><span class="primary"></span><span class="secondary"></span></span><div><strong>Agent K</strong><p id="status">正在读取会话…</p><section class="track"><span class="progress" id="progress"></span></section></div><i></i></main></body>
</html>
